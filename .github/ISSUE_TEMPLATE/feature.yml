name: Feature request
description: Ask for something mot does not do today
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does mot get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The tool, flag or behaviour you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
